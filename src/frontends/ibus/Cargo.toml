[package]
name = "kime-ibus"
description = "Kime IBus D-Bus frontend for apps that only speak the IBus protocol"
version = "0.1.0"
authors = ["Riey <creeper844@gmail.com>"]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
kime-engine-core = { path = "../../engine/core" }
kime-version = { path = "../../tools/version" }

log = "0.4"
libc = "0.2"
pico-args = "0.5"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
serde = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
